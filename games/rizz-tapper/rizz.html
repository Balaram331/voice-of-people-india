<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rizz Tapper 🔥</title>
<link rel="icon" type="image/png" href="logo (2).png">
<link rel="stylesheet" href="rizz.css">
</head>

<body>

<div class="bg-glow"></div>

<div class="container">

  <!-- TITLE -->
  <h1 class="title">
    <span class="rizz">RIZZ</span> TAPPER
  </h1>

  <p class="subtitle">Tap. Combo. Slay 😈</p>

  <!--  TOP BAR (cleaned) -->
  <div class="top-bar">
    <span id="timer">⏱️ 35</span>
    <span id="level">Lv 1 🎯 100</span>
    <span id="score">Score: 0</span>
  </div>

  <!--  GAME AREA -->
  <div id="gameArea"></div>

  <!-- RESULT -->
  <div id="result" class="hidden">
    <h2 id="finalScore"></h2>
    <button onclick="startGame()">Play Again</button>
  </div>

</div>

<script src="rizz.js"></script>

</body>
</html>
